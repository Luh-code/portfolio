[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'sha256-NFJTBkFoi99JLNpvjYwbCeI5weQbaRsEnLne22Bisf4='; style-src 'sha256-c4Rw/ppPlzpuhDMvBa3E1/gQDWUgfUqNsk8HtvoQsuU=' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
